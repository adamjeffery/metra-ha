name: Release

# Pushing a version tag publishes a release, but only if every check passes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/metra_train_tracker/manifest.json'))['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version $version. Expected v$version."
            exit 1
          fi

      - uses: home-assistant/actions/hassfest@master

      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements_test.txt

      - run: pytest

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags like v0.3.0b1 become pre-releases, which HACS only offers to beta users.
          prerelease=()
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${prerelease[@]}"
